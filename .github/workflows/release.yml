name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  end-to-end:
    name: end-to-end
    if: github.repository == 'ecadlabs/beacon-sdk-taquito-patches'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same image and tag as ci.yml; check:versions enforces both.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: ./scripts/npm11.sh ci --include=optional

      - name: Build packages
        run: ./scripts/npm11.sh run build

      - name: Run end-to-end tests
        run: ./scripts/npm11.sh run e2e:smoke

  publish-packages:
    name: publish-packages
    needs: end-to-end
    if: github.repository == 'ecadlabs/beacon-sdk-taquito-patches'
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify npm 11 runner
        run: ./scripts/npm11.sh --version

      - name: Install dependencies
        run: ./scripts/npm11.sh ci --include=optional

      - name: Check workspace versions
        run: ./scripts/npm11.sh run check:versions

      - name: Build packages
        run: ./scripts/npm11.sh run build

      - name: Run script tests
        run: node --test scripts/__tests__/*.test.js

      - name: Run unit tests
        run: ./scripts/npm11.sh run test

      - name: Test installed Node packages
        run: ./scripts/npm11.sh run test:node-consumers

      - name: Determine npm dist-tag from ref
        id: dist_tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            *-beta*|*-rc*|*-alpha*) echo "tag=beta" >> "$GITHUB_OUTPUT" ;;
            *)                      echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Publish public packages
        env:
          NPM_DIST_TAG: ${{ steps.dist_tag.outputs.tag }}
        run: ./scripts/npm11.sh run publish:packages
