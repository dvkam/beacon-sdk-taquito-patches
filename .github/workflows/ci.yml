name: CI

on:
  pull_request:
  push:
    branches:
      - taquito-patches

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: ${{ matrix.check-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            check-name: build-and-unit
          - node: 24
            check-name: build-and-unit (Node 24)
          - node: 26
            check-name: build-and-unit (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Verify npm 11 runner
        run: ./scripts/npm11.sh --version

      - name: Install dependencies
        run: ./scripts/npm11.sh ci --include=optional

      - name: Check workspace versions
        run: ./scripts/npm11.sh run check:versions

      - name: Build packages
        run: ./scripts/npm11.sh run build

      # Type-aware lint needs the workspace declarations produced by the build.
      - name: Gate new lint findings
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -n "$PR_BASE_REF" ]; then
            export LINT_BASE_REF="origin/$PR_BASE_REF"
          fi
          ./scripts/npm11.sh run lint:new

      - name: Run script tests
        run: node --test scripts/__tests__/*.test.js

      - name: Run unit tests
        run: ./scripts/npm11.sh run test

      - name: Test installed Node packages
        run: ./scripts/npm11.sh run test:node-consumers

  end-to-end:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Browsers and their system libraries ship in the image, so e2e never
    # depends on Ubuntu's apt mirrors. scripts/check-playwright-image.mjs keeps
    # the tag in step with the locked @playwright/test version.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001 --ipc=host

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify npm 11 runner
        run: ./scripts/npm11.sh --version

      - name: Install dependencies
        run: ./scripts/npm11.sh ci --include=optional

      - name: Check workspace versions
        run: ./scripts/npm11.sh run check:versions

      - name: Build packages
        run: ./scripts/npm11.sh run build

      - name: Run end-to-end tests
        run: ./scripts/npm11.sh run e2e:smoke

      - name: Run UI viewport rendering tests (when UI-related files change)
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then
            echo "Push event: running UI viewport suite."
            ./scripts/npm11.sh run e2e:ui
            exit 0
          fi
          BASE_REF="origin/${PR_BASE_REF:-taquito-patches}"
          CHANGED=$(git diff --name-only "$BASE_REF"...HEAD -- \
            'packages/beacon-ui/**' \
            'packages/beacon-dapp/src/events.ts' \
            'e2e/ui-viewport-rendering.spec.ts' \
            'playwright.config.ts' \
            'webpack.config.js' \
            'package.json' \
            'package-lock.json')
          if [ -n "$CHANGED" ]; then
            echo "UI-related changes detected:"
            echo "$CHANGED"
            ./scripts/npm11.sh run e2e:ui
          else
            echo "No UI-related changes detected; skipping e2e:ui matrix."
          fi
