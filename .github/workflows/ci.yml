name: CI

on:
  pull_request:
  push:
    branches:
      - taquito-patches

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit:
    name: ${{ matrix.check-name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            check-name: build-and-unit
          - node: 24
            check-name: build-and-unit (Node 24)
          - node: 26
            check-name: build-and-unit (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Verify npm 11 runner
        run: ./scripts/npm11.sh --version

      - name: Install dependencies
        run: ./scripts/npm11.sh ci --include=optional

      - name: Check workspace versions
        run: ./scripts/npm11.sh run check:versions

      - name: Build packages
        run: ./scripts/npm11.sh run build

      # Type-aware lint needs the workspace declarations produced by the build.
      - name: Gate new lint findings
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -n "$PR_BASE_REF" ]; then
            export LINT_BASE_REF="origin/$PR_BASE_REF"
          fi
          ./scripts/npm11.sh run lint:new

      - name: Run script tests
        run: node --test scripts/__tests__/*.test.js

      - name: Run unit tests
        run: ./scripts/npm11.sh run test

      - name: Test installed Node packages
        run: ./scripts/npm11.sh run test:node-consumers

  end-to-end:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Verify npm 11 runner
        run: ./scripts/npm11.sh --version

      - name: Install dependencies
        run: ./scripts/npm11.sh ci --include=optional

      - name: Check workspace versions
        run: ./scripts/npm11.sh run check:versions

      - name: Build packages
        run: ./scripts/npm11.sh run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: ./scripts/npm11.sh run e2e:smoke
