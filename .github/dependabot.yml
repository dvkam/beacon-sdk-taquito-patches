version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-major:
        patterns:
          - "*"
        update-types:
          - major
    ignore:
      # WalletConnect 2.23+ normalizes requiredNamespaces into optionalNamespaces,
      # which breaks Kukai iOS until its WalletConnect SDK can be updated.
      - dependency-name: "@walletconnect/*"
      # TypeScript 6.0 drops ES5 target, node10 moduleResolution, and baseUrl defaults.
      - dependency-name: "typescript"
        versions:
          - ">= 6.0.0"
